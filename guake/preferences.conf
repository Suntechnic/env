[general]
background-image-file=''
default-shell='/bin/zsh'
display-n=0
display-tab-names=0
gtk-use-system-default-theme=true
hide-tabs-if-one-tab=false
history-size=2000
load-guake-yml=true
max-tab-name-length=100
mouse-display=true
open-tab-cwd=true
prompt-on-quit=true
quick-open-command-line='google-chrome %(file_path)s'
quick-open-enable=true
restore-tabs-notify=false
restore-tabs-startup=false
save-tabs-when-changed=false
scroll-keystroke=true
start-at-login=true
use-default-font=false
use-popup=true
use-scrollbar=true
use-trayicon=true
window-halignment=0
window-height=50
window-losefocus=false
window-refocus=false
window-tabbar=true
window-vertical-displacement=0
window-width=100

[keybindings/local]
next-tab='<Primary>Page_Down'
split-tab-horizontal='<Primary>F12'
split-tab-vertical='<Primary><Shift>F12'
switch-tab-last='disabled'
switch-tab1='<Primary>F1'

[style/background]
transparency=100

[style/font]
allow-bold=true
cell-height-scale=1.0
palette='#000000000000:#F5F518181818:#4343B2B24444:#F2F2AEAE4949:#282865658F8F:#A3A37A7ACCCC:#20207F7F4C4C:#6C6C78788080:#6C6C76768080:#F0F071717171:#8686B3B30000:#FFFF99994040:#5555B4B4D4D4:#FEFE7676FFFF:#3939CBCBCCCC:#AAAABFBFA9A9:#222222222222:#F8F8FBFBF1F1'
palette-name='Green Papper Chrome Green'
style='Monospace 16'
